<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>MTG Matches</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 16px;
      background: #0f0f0f;
      color: #eaeaea;
    }

    details {
      border: 1px solid #333;
      border-radius: 8px;
      margin-bottom: 12px;
      padding: 8px;
      background: #161616;
    }

    summary {
      cursor: pointer;
      font-weight: 600;
    }

    .video-details {
      margin-top: 8px;
      border: 1px solid #2a2a2a;
      background: #121212;
    }

    .video {
      padding: 8px;
    }

    .meta {
      font-size: 12px;
      opacity: 0.6;
      margin-bottom: 6px;
    }

    iframe {
      width: 100%;
      height: 420px;
      border: 0;
      border-radius: 6px;
    }

    .event-title {
      font-size: 16px;
      font-weight: 600;
    }

    .event-meta {
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>

<body>
  <h1>MTG Matches</h1>
  <div id="app">Loading...</div>

  <script>
    function loadPlayer(el, id) {
      if (el.dataset.loaded) return;

      const iframe = document.createElement("iframe");
      iframe.src = `https://www.youtube-nocookie.com/embed/${id}`;
      iframe.allow =
        "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
      iframe.allowFullscreen = true;

      el.appendChild(iframe);
      el.dataset.loaded = "true";
    }

    document.addEventListener("toggle", (e) => {
      const details = e.target;

      if (!details.classList.contains("video-details")) return;
      if (!details.open) return;

      const player = details.querySelector(".player");
      if (player) loadPlayer(player, player.dataset.id);
    }, true);

    async function load() {
      const res = await fetch("data/tournaments.json");
      const data = await res.json();

      const app = document.getElementById("app");
      app.innerHTML = "";

      for (const [eventKey, videos] of Object.entries(data)) {

        // -------------------------
        // Tournament container
        // -------------------------
        const eventDetails = document.createElement("details");

        const summary = document.createElement("summary");
        summary.innerHTML = `
          <div class="event-title">${eventKey}</div>
          <div class="event-meta">${videos.length} matches</div>
        `;

        eventDetails.appendChild(summary);

        // -------------------------
        // Videos (hidden until opened)
        // -------------------------
        for (const v of videos) {

          const videoDetails = document.createElement("details");
          videoDetails.className = "video-details";

          const videoSummary = document.createElement("summary");

          let summaryTitle = "";
          if (v.stage.type === 'draft') {
            summaryTitle = "Featured Draft"
          } else if (v.stage.type === "round") {
            summaryTitle = `Round ${v.stage.value}`
          } else {
            summaryTitle = v.stage.type.charAt(0).toUppercase() + v.stage.type.slice(1)
          }

          videoSummary.textContent = `${summaryTitle} • ${new Date(v.publishedAt).toLocaleString()}`;

          const wrapper = document.createElement("div");
          wrapper.className = "video";

          const player = document.createElement("div");
          player.className = "player";
          player.dataset.id = v.id;

          wrapper.appendChild(meta);
          wrapper.appendChild(player);

          videoDetails.appendChild(videoSummary);
          videoDetails.appendChild(wrapper);

          eventDetails.appendChild(videoDetails);
        }

        app.appendChild(eventDetails);
      }
    }

    load();
  </script>
</body>

</html>
